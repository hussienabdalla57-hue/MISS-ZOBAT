<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حساب وجبات الميس</title>
<meta name="theme-color" content="#2a4a35">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:'IBM Plex Sans Arabic';font-weight:400;src:local('IBM Plex Sans Arabic Regular'),url(fonts/IBMPlexSansArabic-Regular.ttf) format('truetype')}
@font-face{font-family:'IBM Plex Sans Arabic';font-weight:500;src:local('IBM Plex Sans Arabic Medium'),url(fonts/IBMPlexSansArabic-Medium.ttf) format('truetype')}
@font-face{font-family:'IBM Plex Sans Arabic';font-weight:600;src:local('IBM Plex Sans Arabic SemiBold'),url(fonts/IBMPlexSansArabic-SemiBold.ttf) format('truetype')}
@font-face{font-family:'IBM Plex Sans Arabic';font-weight:700;src:local('IBM Plex Sans Arabic Bold'),url(fonts/IBMPlexSansArabic-Bold.ttf) format('truetype')}
:root{--bg:#e9eee7;--card:#fff;--ink:#1c261b;--mut:#66725f;--pri:#34462d;--pi:#fff;--line:#d5ddd0;--acc:#9a7a22;--soft:#dfe7da;--bad:#a8342b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121812;--card:#1b241a;--ink:#e6ece3;--mut:#93a08d;--pri:#8fb585;--pi:#10170f;--line:#2b3828;--acc:#d2ae54;--soft:#26331f;--bad:#e27a70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121812;--card:#1b241a;--ink:#e6ece3;--mut:#93a08d;--pri:#8fb585;--pi:#10170f;--line:#2b3828;--acc:#d2ae54;--soft:#26331f;--bad:#e27a70;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:15px;line-height:1.6;padding-bottom:84px}
header{padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:20px;font-weight:700;margin:0;color:var(--pri)}
h3{font-size:15px;font-weight:600;margin:0 0 8px}
main{padding:0 14px;max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--soft);color:var(--ink);font-weight:500}
button.pri{background:var(--pri);color:var(--pi);width:100%;padding:13px;font-size:16px;font-weight:600;margin-bottom:14px}
button.x{background:none;color:var(--bad);padding:6px 10px;font-size:18px}
.row{display:flex;gap:8px;margin-bottom:8px}
.ing{display:grid;grid-template-columns:1fr 1fr auto auto;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ing input:first-child{grid-column:1/-1}
.ex{display:grid;grid-template-columns:1fr 100px auto;gap:6px;align-items:center;padding:6px 0}
.t{min-width:62px;text-align:left;font-weight:600;color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:6px 13px}
.chip.on{background:var(--pri);color:var(--pi);border-color:var(--pri)}
.sum div,.fig div{display:flex;justify-content:space-between;padding:3px 0}
.big{font-size:22px;font-weight:700;color:var(--acc)}
.mut{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}
td:last-child,th:last-child{text-align:left}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border-radius:10px;padding:8px 2px;color:var(--mut);font-size:13px}
nav button.on{background:var(--soft);color:var(--pri);font-weight:700}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--pri);color:var(--pi);padding:9px 18px;border-radius:20px;z-index:9}
.lock{background:var(--soft);padding:8px 12px;border-radius:8px;font-weight:600;color:var(--acc);margin-bottom:12px}
tr.go{cursor:pointer}
.ml{padding:8px 0;border-bottom:1px solid var(--line)}
:root{--bg:#edf1f6;--card:#fff;--ink:#17212f;--mut:#5a6779;--pri:#1d4f7c;--pi:#fff;--line:#d2dce8;--acc:#a8691a;--soft:#e0e9f3;--bad:#b42318}
@media(prefers-color-scheme:dark){:root:not([data-theme='light']){--bg:#0d141c;--card:#151f2b;--ink:#e6edf5;--mut:#92a2b5;--pri:#6aa9de;--pi:#08131e;--line:#26364a;--acc:#e3b255;--soft:#1c2b3c;--bad:#f28b82}}
:root[data-theme='dark']{--bg:#0d141c;--card:#151f2b;--ink:#e6edf5;--mut:#92a2b5;--pri:#6aa9de;--pi:#08131e;--line:#26364a;--acc:#e3b255;--soft:#1c2b3c;--bad:#f28b82}
.per{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.per label{font-size:12px;color:var(--mut);display:flex;flex-direction:column}
.per input{width:auto;padding:5px 7px;font-size:14px}
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
th{color:var(--mut);font-weight:600;font-size:13px}
@media(min-width:900px){body{font-size:16px}header,main{max-width:1180px;margin:auto}main{padding:0 24px}header{padding:20px 24px 10px}#meal,#report{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start}#meal>button.pri,#meal>h3,#meal>#mlist,#report>.lock,#report>.pri{grid-column:1/-1}#stock,#people,#settings{max-width:820px;margin:auto}nav{inset-inline:auto;left:50%;right:auto;transform:translateX(-50%);width:720px;border-radius:14px 14px 0 0;border:1px solid var(--line)}}
:root{--bg:#e7eee3;--card:#fff;--ink:#1c2a1f;--mut:#5d6e60;--pri:#2e5233;--pi:#fff;--line:#d2dccd;--acc:#a37f1c;--soft:#e1ead9;--bad:#b3261e;--side:#3b5b2f;--hdr:#2a4a35;--gold:#c9a227}
@media(prefers-color-scheme:dark){:root:not([data-theme='light']){--bg:#0e1611;--card:#16211a;--ink:#e4ede4;--mut:#92a594;--pri:#82bd8c;--pi:#0a130d;--line:#26382b;--acc:#dab24c;--soft:#1d2c21;--bad:#f28b82;--side:#15231a;--hdr:#12261a;--gold:#c9a227}.badge.ok{background:#1f4a2a;color:#9fe0aa}.badge.warn{background:#4a3b0f;color:#f1cf6b}.badge.bad{background:#4d211d;color:#f6a49c}}
:root[data-theme='dark']{--bg:#0e1611;--card:#16211a;--ink:#e4ede4;--mut:#92a594;--pri:#82bd8c;--pi:#0a130d;--line:#26382b;--acc:#dab24c;--soft:#1d2c21;--bad:#f28b82;--side:#15231a;--hdr:#12261a;--gold:#c9a227}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;color:#fff;background:linear-gradient(115deg,var(--hdr) 0 72%,var(--gold) 72% 74%,#1f3a29 74%)}
header h1{color:#fff;font-size:18px;margin:0;line-height:1.3}
.brand{display:flex;gap:10px;align-items:center}.brand small{color:#d3e3cd;font-size:12px}
.per label{color:#d3e3cd}.per input{background:#f3f7f0;color:#1c2a1f;border-color:transparent}
header .x{color:#e8f1e3;font-size:14px}
.badge{display:inline-block;padding:2px 11px;border-radius:20px;font-size:12px;font-weight:600;background:var(--soft);color:var(--ink)}
.badge.ok{background:#d6ecd7;color:#1d6b2a}.badge.warn{background:#f6e7bd;color:#85600a}.badge.bad{background:#f7d4d0;color:#a1231a}
.card,.kpi{box-shadow:0 1px 3px rgba(20,40,25,.08)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .kl{color:var(--mut);font-size:13px}.kpi .kv{font-size:22px;font-weight:700;color:var(--pri)}.kpi .ks{color:var(--mut);font-size:12px;min-height:18px}
.two{display:grid;gap:12px;grid-template-columns:1fr}
.ct{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.ct h3{margin:0}
button.gold{background:var(--gold);color:#1b1500;font-weight:600}
.pills{display:flex;gap:6px;flex:1}.pill{flex:1;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 4px}.pill.on{background:var(--pri);color:var(--pi);border-color:var(--pri)}
th{background:var(--soft);padding:9px 6px}
tr:nth-child(even) td{background:rgba(110,140,110,.06)}
nav{overflow-x:auto;gap:2px}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;flex:1 0 auto;font-size:12px}
@media(min-width:900px){
  .two{grid-template-columns:1fr 1fr}
  header{padding:14px 28px;max-width:none;margin:0}
  nav{inset-inline:auto;left:auto;right:0;top:78px;bottom:0;transform:none;width:216px;border-radius:0;border:0;flex-direction:column;background:var(--side);padding:14px 10px;overflow-y:auto;gap:4px}
  nav button{flex:0 0 auto;flex-direction:row;gap:10px;min-width:0;width:100%;justify-content:flex-start;color:#dbe8d6;padding:11px 14px;font-size:15px}
  nav button.on{background:var(--gold);color:#1b1500}
  main{max-width:none;margin:0 216px 0 0;padding:20px 28px 40px}
  body{padding-bottom:0}
}
@media(min-width:900px){
  header{position:sticky;top:0;z-index:30;height:72px;padding:0 28px;flex-wrap:nowrap}
  nav{top:72px}
  main{margin:0 216px 0 0;padding:24px 32px 56px}
  main>section{max-width:1180px;margin-inline:auto}
  #meal,#report{display:block}
  #stock,#people,#settings{max-width:1180px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:12px}
  .cols.w{grid-template-columns:minmax(300px,1fr) minmax(0,2fr)}
  .cols.w2{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
  .col{display:flex;flex-direction:column;gap:14px}
  .col>.card,.col>.pri{margin:0}
  #mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  #mlist>.card{margin:0}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .acts>.pri{margin:0}
  .card{padding:16px}
  .kpis.k3{grid-template-columns:repeat(3,1fr)}
}
[hidden]{display:none!important}
@media print{nav,header input,button{display:none}}
</style>
</head>
<body>
<header hidden><div class='brand'><svg viewBox='0 0 48 48' width='44' height='44' aria-hidden='true'><circle cx='24' cy='24' r='22' fill='#223d2b' stroke='#c9a227' stroke-width='3'/><path d='M24 9l4.4 9 9.9 1.4-7.2 7 1.7 9.8L24 31.5l-8.8 4.7 1.7-9.8-7.2-7 9.9-1.4z' fill='#c9a227'/></svg><div><h1>منظومة إدارة وحسابات الميس</h1><small>ميس الضباط</small></div></div><div class='per'><span id='stt' class='badge'></span><label>من<input type='date' id='pf'></label><label>إلى<input type='date' id='pt'></label><button class='x' data-act='out'>خروج</button></div></header>
<main hidden>
<section id="home" hidden></section>
<section id="meal" hidden></section>
<section id="people" hidden></section>
<section id="report" hidden></section>
<section id="stock" hidden></section>
<section id="settings" hidden></section>
</main>
<nav id="nav" hidden></nav>
<datalist id="cat"></datalist>
<div id="auth" hidden></div>
<script>
const $=s=>document.querySelector(s),KEY='mess-v1';
const def=()=>({people:[],catalog:{},meals:[],monthly:{},closed:{},stock:[],cash:[],counts:{},arch:[]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||def()}catch(e){S=def()}
S.closed=S.closed||{};S.stock=S.stock||[];S.cash=S.cash||[];S.counts=S.counts||{};S.arch=S.arch||[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const f=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const num=v=>{const s=String(v==null?'':v).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).replace(/[٫،,]/g,'.').replace(/[^0-9.\-]/g,'');const n=parseFloat(s);return isNaN(n)?0:n};
const nd=()=>({date:today(),type:'غداء',name:'',ings:[{n:'',q:'',p:''}],ex:[],att:[]});
let D=nd(),P=initP(),month=P.from,tab='meal',sure=null,flt='',editId=null,repP=null,stSub='items',curRows=[],repBack='report';
const tot=m=>m.ings.reduce((a,i)=>a+(+i.q||0)*(+i.p||0),0)+m.ex.reduce((a,e)=>a+(+e.a||0),0);
const pname=id=>(S.people.find(p=>p.id===id)||{name:'(محذوف)'}).name;
const TABS=[['meal','الوجبة'],['people','الأفراد'],['report','الكشف'],['stock','المخزن'],['settings','احتياطي']];
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}a.remove();return ok}}
function go0(t){tab=t;TABS.forEach(([k])=>$('#'+k).hidden=k!==t);$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===t?'on':''}" data-act="tab" data-v="${k}">${l}</button>`).join('');({meal:rMeal,people:rPeople,report:rReport,stock:rStock,settings:rSet})[t]()}
function cat(){$('#cat').innerHTML=[...new Set([...Object.keys(S.catalog),...S.stock.map(x=>x.n)])].map(k=>`<option value="${esc(k)}">`).join('')}

function rMeal(){
  $('#meal').innerHTML=`
  <div class='cols'><div class='col'><div class="card"><div class="row"><input type="date" data-d="date" value="${D.date}"><div class='pills'>${['إفطار','غداء','عشاء'].map(t=>`<button class='pill${t===D.type?' on':''}' data-act='mt' data-v='${t}'>${t}</button>`).join('')}</div></div>
  <input data-d="name" placeholder="اسم الوجبة (مثال: فراخ مشوية وأرز)" value="${esc(D.name)}"></div>
  <div class="card"><h3>المكونات وأسعارها</h3><div id="ings"></div><button data-act="addIng">إضافة مكوّن</button></div>
  <div class="card"><h3>نثريات الوجبة</h3><div id="exs"></div><button data-act="addEx">إضافة بند</button></div>
  </div><div class='col'><div class="card"><h3>الحاضرون <span class="mut" id="cnt"></span></h3><input id="flt" placeholder="بحث في الأسماء" value="${esc(flt)}" style="margin-bottom:8px"><div class="chips" id="chips"></div>
  <div class="row"><input id="newp" placeholder="اسم جديد أو ضيف"><button data-act="addP" style="white-space:nowrap">إضافة</button></div></div>
  <div class="card sum" id="sum"></div>
  <button class="pri" data-act="saveMeal">حفظ الوجبة وخصم المخزون</button></div></div>
  <h3>وجبات الفترة</h3><div id="mlist"></div>`;
  rIngs();rExs();rChips();sum();rList();cat()
}
function rIngs(){$('#ings').innerHTML=D.ings.map((x,i)=>`<div class="ing"><input list="cat" data-l="ings" data-i="${i}" data-f="n" placeholder="الصنف" value="${esc(x.n)}"><input type="text" inputmode="decimal" data-l="ings" data-i="${i}" data-f="q" placeholder="الكمية" value="${x.q}"><input type="text" inputmode="decimal" data-l="ings" data-i="${i}" data-f="p" placeholder="سعر الوحدة" value="${x.p}"><span class="t">${f(num(x.q)*num(x.p))}</span><button class="x" data-act="delIng" data-i="${i}" aria-label="حذف">×</button></div>`).join('')}
function rExs(){$('#exs').innerHTML=D.ex.map((x,i)=>`<div class="ex"><input data-l="ex" data-i="${i}" data-f="n" placeholder="البند (غاز، عمالة...)" value="${esc(x.n)}"><input type="text" inputmode="decimal" data-l="ex" data-i="${i}" data-f="a" placeholder="المبلغ" value="${x.a}"><button class="x" data-act="delEx" data-i="${i}" aria-label="حذف">×</button></div>`).join('')}
function rChips(){
  $('#chips').innerHTML=(S.people.length?`<button class="chip" data-act="all">الكل</button>`:'<span class="mut">أضف أسماء الأفراد من هنا أو من تبويب الأفراد</span>')+S.people.filter(p=>p.name.includes(flt)).map(p=>`<button class="chip${D.att.includes(p.id)?' on':''}" data-act="tg" data-id="${p.id}">${esc(p.name)}</button>`).join('');
  $('#cnt').textContent='('+D.att.length+')'}
function sum(){
  const a=D.ings.reduce((s,i)=>s+num(i.q)*num(i.p),0),b=D.ex.reduce((s,e)=>s+num(e.a),0),n=D.att.length,stk=stkHint();
  $('#sum').innerHTML=`<div><span>المكونات</span><b>${f(a)}</b></div><div><span>نثريات الوجبة</span><b>${f(b)}</b></div><div><span>الإجمالي</span><b>${f(a+b)}</b></div><div><span>عدد الحاضرين</span><b>${n}</b></div><div><span>تكلفة الفرد</span><span class="big">${n?f((a+b)/n):'—'}</span></div><div class="mut">قبل إضافة نصيب نثريات الشهر، ويظهر في الكشف.</div>${stk}`;
  document.querySelectorAll('#ings .t').forEach((e,i)=>e.textContent=f(num(D.ings[i].q)*num(D.ings[i].p)))}
function rList(){
  const ms=S.meals.filter(m=>inP(m.date)).sort((a,b)=>b.date.localeCompare(a.date));
  $('#mlist').innerHTML=ms.length?ms.map(m=>`<div class="card"><div class="row" style="justify-content:space-between;margin:0"><b>${m.date} - ${m.type}</b><button class="x" data-act="delMeal" data-id="${m.id}">${sure===m.id?'تأكيد الحذف؟':'حذف'}</button></div><div>${esc(m.name||'بدون اسم')}</div><div class="mut">${m.att.length} حاضر، تكلفة الفرد ${f(tot(m)/m.att.length)}</div></div>`).join(''):'<p class="mut">لا توجد وجبات مسجلة في هذا الشهر.</p>'}

function rPeople(){
  $('#people').innerHTML=`${peopleTable()}<div class='cols'><div class='col'><div class="card"><h3>إضافة قائمة أسماء (من الأقدم للأحدث)</h3><textarea id="bulk" rows="4" placeholder="ألصق الأسماء، كل اسم في سطر"></textarea><button data-act="bulk" style="margin-top:8px">إضافة القائمة</button></div><div class="card"><h3>إضافة فرد</h3><div class="row"><input id="np" placeholder="الرتبة والاسم"><button data-act="addP2" style="white-space:nowrap">إضافة</button></div></div></div><div class='col'>
  <div class="card">${S.people.length?S.people.map(p=>`<div class="row" style="justify-content:space-between;align-items:center;margin:0;border-bottom:1px solid var(--line)">${editId===p.id?`<input id="en" value="${esc(p.name)}" style="margin:4px 0"><button data-act="saveP" data-id="${p.id}">حفظ</button>`:`<span>${esc(p.name)}</span><span style="white-space:nowrap"><button class="x" style="color:var(--mut);font-size:14px" data-act="mv" data-id="${p.id}" data-d="-1" aria-label="أعلى">▲</button><button class="x" style="color:var(--mut);font-size:14px" data-act="mv" data-id="${p.id}" data-d="1" aria-label="أسفل">▼</button><button class="x" style="color:var(--pri);font-size:14px" data-act="editP" data-id="${p.id}">تعديل</button><button class="x" data-act="delP" data-id="${p.id}">${sure===p.id?'تأكيد؟':'حذف'}</button></span>`}</div>`).join(''):'<p class="mut">لم تضف أحدًا بعد. اكتب الاسم واضغط إضافة.</p>'}</div></div></div>`}

function calc(){
  const ms=S.meals.filter(m=>inP(m.date)),pm=ms.reduce((a,m)=>a+m.att.length,0),mon=num(S.monthly[month]),share=pm?mon/pm:0,per={};
